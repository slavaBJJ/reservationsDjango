{% extends 'layouts/base.html' %}
{% block title %}Ajouter un artiste{% endblock %}
{% block content %}
<section class="auth-section"><div class="container"><div class="auth-card mx-auto"><p class="section-kicker">Catalogue des artistes</p><h1>Ajouter un artiste</h1><form action="{% url 'catalogue:artist-create' %}" method="post">{% csrf_token %}{{ form.as_p }}<div class="d-flex gap-3"><button class="btn btn-primary flex-grow-1" type="submit">Ajouter</button><a class="btn btn-outline-secondary" href="{% url 'catalogue:artist-index' %}">Annuler</a></div></form></div></div></section>
{% endblock %}
