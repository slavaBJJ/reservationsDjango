{% extends 'layouts/base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}<section class="auth-section"><div class="container"><div class="auth-card mx-auto"><p class="section-kicker">Gestion des tarifs</p><h1>{{ title }}</h1><form method="post">{% csrf_token %}{{ form.as_p }}<div class="d-flex gap-3"><button class="btn btn-primary flex-grow-1" type="submit">Enregistrer</button><a class="btn btn-outline-secondary" href="{% if price %}{% url 'catalogue:price-show' price.id %}{% else %}{% url 'catalogue:price-index' %}{% endif %}">Annuler</a></div></form></div></div></section>{% endblock %}
