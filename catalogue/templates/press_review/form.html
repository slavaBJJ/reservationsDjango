{% extends 'layouts/base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}<section class="auth-section"><div class="container"><div class="auth-card signup-card mx-auto"><p class="section-kicker">Espace critique</p><h1>{{ title }}</h1><p class="text-body-secondary">Ajoutez le texte de l’article, un lien externe, ou les deux. La critique sera soumise à modération.</p><form method="post">{% csrf_token %}{{ form.as_p }}<div class="d-flex gap-3"><button class="btn btn-primary flex-grow-1" type="submit">Envoyer pour modération</button><a class="btn btn-outline-secondary" href="{% url 'catalogue:press-review-index' %}">Annuler</a></div></form></div></div></section>{% endblock %}
