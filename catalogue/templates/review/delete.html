{% extends 'layouts/base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
    <h1>{{ title }}</h1>
    <p>Voulez-vous vraiment supprimer votre avis sur « {{ review.show.title }} » ?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Confirmer la suppression</button>
    </form>

    <nav><a href="{% url 'catalogue:show-show' review.show.id %}">Annuler</a></nav>
{% endblock %}
