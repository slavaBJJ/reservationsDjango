{% extends 'layouts/base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}<section class="auth-section"><div class="container"><div class="auth-card mx-auto text-center"><p class="section-kicker">Suppression</p><h1>{{ title }}</h1><p>Voulez-vous vraiment supprimer votre avis sur « {{ review.show.title }} » ?</p><form method="post">{% csrf_token %}<button class="btn btn-danger w-100" type="submit">Confirmer la suppression</button></form><p class="mt-4 mb-0"><a href="{% url 'catalogue:show-show' review.show.id %}">Annuler</a></p></div></div></section>{% endblock %}
