{% extends 'layouts/base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
    <h1>{{ title }}</h1>
    <p><strong>Spectacle :</strong> {{ show.title }}</p>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Envoyer pour modération</button>
    </form>

    <nav><a href="{% url 'catalogue:show-show' show.id %}">Annuler</a></nav>
{% endblock %}
